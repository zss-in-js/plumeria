name: mdn-data
on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdn-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node

      - name: Update the MDN and webref data
        run: pnpm update --workspace-root --latest mdn-data @mdn/browser-compat-data @webref/css

      - name: Regenerate the property list and the CSS types
        run: |
          pnpm --filter @plumeria/eslint-plugin properties
          pnpm --filter @plumeria/core csstypes

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Type-check and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm exec tsc --noEmit --project tsconfig.test.json
          pnpm exec jest packages/eslint-plugin packages/core

      - name: Commit each file and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit() {
            if ! git diff --quiet -- "$1"; then
              git add "$1"
              git commit -m "$2"
            fi
          }
          commit package.json 'chore: update the MDN and webref data in package.json'
          commit pnpm-lock.yaml 'chore: update the MDN and webref data in pnpm-lock.yaml'
          commit packages/eslint-plugin/src/util/cssPropertyData.ts 'chore(eslint-plugin/util): regenerate the CSS property list from MDN data in cssPropertyData.ts'
          commit packages/core/lib/csstypes.d.ts 'chore(core/lib): regenerate the CSS types from mdn-data in csstypes.d.ts'
          git push
