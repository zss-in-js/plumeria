name: bench
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**'
      - 'scripts/bench-*'
      - '.github/workflows/bench.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.baseline.outputs.sha }}
      label: ${{ steps.baseline.outputs.label }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Select the benchmark base
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          sha="$BASE_SHA"
          label=''
          if [ "$HEAD_REF" = 'changeset-release/main' ]; then
            sha=$(git log "$BASE_SHA" --first-parent -1 --format=%H \
              --extended-regexp \
              --grep='^Version Packages \(#[0-9]+\)$' \
              --grep='^Merge pull request #[0-9]+ from .*/changeset-release/main$')
            if [ -z "$sha" ]; then
              echo 'No previous merged Version Packages PR found.' >&2
              exit 1
            fi
            subject=$(git show -s --format=%s "$sha")
            number=$(printf '%s\n' "$subject" | sed -E 's/.*#([0-9]+).*/\1/')
            label="$subject"
            if [[ "$subject" == 'Merge pull request '* ]]; then
              title=$(git show -s --format=%b "$sha" | sed -n '/[^[:space:]]/{p;q;}')
              label="${title} (#${number})"
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Benchmark base: $sha"

  measure:
    needs: baseline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One runner per suite. Suites never share a machine: a benchmark that
      # runs beside another measures the contention, and the base/PR
      # alternation cancels drift rather than a neighbour's load.
      matrix:
        include:
          - id: scan
            script: bench-compare-scan.js
          - id: transform
            script: bench-compare-transform.js
    steps:
      # Rebuild both revisions on this runner to avoid comparing past machines.
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.baseline.outputs.sha }}
          path: .bench-base
          clean: false

      - uses: ./.github/actions/setup-node

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build the head
        run: pnpm build

      - name: Build the base
        run: |
          pnpm --dir .bench-base install
          pnpm --dir .bench-base build

      - name: Measure
        id: bench
        run: node "scripts/${{ matrix.script }}" .bench-base . > "bench-${{ matrix.id }}.md"

      - name: Record the parse call verdict
        run: printf '%s' '${{ steps.bench.outputs.regressed }}' > "regressed-${{ matrix.id }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.id }}
          path: |
            bench-${{ matrix.id }}.md
            regressed-${{ matrix.id }}.txt

  report:
    needs: [baseline, measure]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true

      - name: Assemble the report
        env:
          BASE_SHA: ${{ needs.baseline.outputs.sha }}
          BASE_LABEL: ${{ needs.baseline.outputs.label }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The scan report carries the marker the comment lookup matches, so
          # it stays first.
          : > bench.md
          for suite in scan transform; do
            [ -f "bench-$suite.md" ] || continue
            if [ -s bench.md ]; then printf '\n' >> bench.md; fi
            cat "bench-$suite.md" >> bench.md
          done
          printf '\nCompared revisions:\n\n- Base: [%s](%s/%s/commit/%s)\n- PR: [%s (#%s)](%s/%s/commit/%s)\n' \
            "${BASE_LABEL:-Base commit}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BASE_SHA" \
            "$PR_TITLE" "$PR_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$HEAD_SHA" >> bench.md

      - name: Publish job summary
        run: cat bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --paginate --jq \
            '.[] | select(.body | startswith("<!-- plumeria-bench -->")) | .id' \
            | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@bench.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file bench.md
          fi

      - name: Fail on a suite that did not finish
        if: ${{ needs.measure.result != 'success' }}
        run: |
          echo 'A benchmark suite did not finish.' >&2
          exit 1

      - name: Fail on a wider invalidation
        run: |
          if grep -qx true regressed-*.txt 2>/dev/null; then
            echo 'The scan or transform makes more SWC parse calls than the base.' >&2
            exit 1
          fi
