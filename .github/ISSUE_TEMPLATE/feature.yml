name: Feature Request
description: Suggest an idea
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true
  - type: checkboxes
    id: ai
    attributes:
      label: AI acknowledgment
      description: Write this issue yourself. You can use AI to help build a reproduction. See the AI Usage Policy in the contributing guidelines.
      options:
        - label: I did not use AI to generate this issue.
        - label: (If the above is not checked) I have reviewed the AI-generated content before submitting.
