[package]
name = "plumeria-compiler"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
globset = "0.4"
ignore = "0.4"
indexmap = "2"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "=3.6.0"
oxc_allocator = "0.146.0"
oxc_ast = "0.146.0"
oxc_ast_visit = "0.146.0"
oxc_parser = "0.146.0"
oxc_semantic = "0.146.0"
oxc_span = "0.146.0"
oxc_syntax = "0.146.0"
rayon = "1"
rustc-hash = "2"
ryu-js = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
napi-build = "=2.3.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
